
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Registration Form</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      padding: 30px 16px;
      color: #1e293b;
    }

    .content {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      font-size: clamp(24px, 4vw, 32px);
      color: #0f2f5f;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    form {
      width: 100%;
    }

    fieldset.data {
      min-width: 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    legend {
      padding: 8px 12px;
      color: #095696;
      font-size: 18px;
      font-weight: 600;
    }

    .input-data {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-data label {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    input:not([type="radio"]):not([type="checkbox"]),
    textarea {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #2961c7;
      box-shadow: 0 0 0 3px rgba(41, 97, 199, 0.12);
    }

    input[type="radio"] {
      accent-color: #2961c7;
      margin-right: 8px;
    }

    .gender-options {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 4px;
    }

    .gender-options label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 400;
      cursor: pointer;
    }

    input[type="file"] {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      width: 100%;
      max-width: 100%;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #2961c7;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1e4da8;
    }

    /* Tablet */
    @media (max-width: 768px) {
      body {
        padding: 20px 12px;
      }

      .content {
        padding: 24px 18px;
      }

      fieldset.data {
        padding: 20px 16px;
        gap: 16px;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
      }

      .content {
        padding: 22px 14px;
        border-radius: 8px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.3;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 24px;
      }

      fieldset.data {
        grid-template-columns: 1fr;
        padding: 18px 12px;
        gap: 18px;
        margin-bottom: 24px;
      }

      legend {
        font-size: 15px;
        padding: 6px;
      }

      .full-width {
        grid-column: auto;
      }

      input:not([type="radio"]):not([type="checkbox"]),
      textarea {
        font-size: 16px;
      }

      button {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="content">
    <h1>Professional Registration Form</h1>
    <p class="subtitle">
      Please fill out all the details carefully below.
    </p>

    <form action="#" method="post" enctype="multipart/form-data">

      <!-- Personal Information -->
      <fieldset class="data">
        <legend>1. Personal Information</legend>

        <div class="input-data">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name"
                 placeholder="Enter your full name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email"
                 placeholder="Enter your email" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="Enter your password" required>
        </div>

        <div class="input-data">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 placeholder="Choose a unique username" required>

          <label for="number">Phone Number</label>
          <input type="tel" id="number" name="phone"
                 placeholder="Enter your phone number"
                 inputmode="numeric" pattern="[0-9]{10}"
                 maxlength="10" required>

          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password"
                 name="confirm_password"
                 placeholder="Confirm your password" required>
        </div>
      </fieldset>

      <!-- Demographics -->
      <fieldset class="data">
        <legend>2. Demographics &amp; Preference</legend>

        <div class="input-data">
          <label for="date">Date of Birth</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="input-data">
          <label>Select Gender</label>
          <div class="gender-options">
            <label>
              <input type="radio" name="gender" value="male" required>
              Male
            </label>

            <label>
              <input type="radio" name="gender" value="female">
              Female
            </label>

            <label>
              <input type="radio" name="gender" value="other">
              Other
            </label>
          </div>
        </div>
      </fieldset>

      <!-- Documents and Message -->
      <fieldset class="data">
        <legend>3. Document &amp; Message</legend>

        <div class="input-data full-width">
          <label for="file">Upload Resume / Document (PDF or DOC)</label>
          <input type="file" id="file" name="resume"
                 accept=".pdf,.doc,.docx">

          <label for="textarea">Bio / Message</label>
          <textarea id="textarea" name="message"
                    placeholder="Type here..."></textarea>
        </div>
      </fieldset>

      <button type="submit">Submit Registration</button>
    </form>
  </main>
</body>
</html>
